name: Android alpha APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Locate Gradle project
        shell: bash
        run: |
          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            echo "GRADLE_DIR=." >> "$GITHUB_ENV"
          elif [[ -f AtelierPad/settings.gradle.kts || -f AtelierPad/settings.gradle ]]; then
            echo "GRADLE_DIR=AtelierPad" >> "$GITHUB_ENV"
          else
            echo "::error::Could not find the Android Gradle project."
            find . -maxdepth 3 -name 'settings.gradle*' -print
            exit 1
          fi

      - name: Compile app, run unit tests, compile device tests
        run: gradle --no-daemon -p "$GRADLE_DIR" :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload debug APK and JVM test results
        uses: actions/upload-artifact@v4
        with:
          name: AtelierPad-debug
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
            **/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
